    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        /* Pengaturan Layout Utama agar Tidak Terpotong & Presisi */
        html {
            width: 100%;
            height: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 !important;
            padding: 24px 16px !important;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #060913;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* --- ELEMEN BACKGROUND TEKNOLOGI (FIXED FULLSCREEN) --- */
        #tech-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .cyber-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            pointer-events: none;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, #00f2fe, #4facfe, transparent);
            box-shadow: 0 0 15px #00f2fe;
            opacity: 0.6;
            z-index: 1;
            animation: scan 8s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { top: 100%; opacity: 0; }
        }

        /* --- KOTAK LOGIN (RESPONSIF & RESPONSIVE DESIGN) --- */
        .login-container {
            width: 100%;
            max-width: 390px;
            background: rgba(13, 22, 41, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 16px;
            padding: 34px 26px;
            box-shadow: 
                0 0 35px rgba(0, 242, 254, 0.18),
                inset 0 0 15px rgba(0, 242, 254, 0.05);
            position: relative;
            z-index: 2;
            margin: auto;
        }

        .login-container::before,
        .login-container::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: #00f2fe;
            border-style: solid;
            pointer-events: none;
        }

        .login-container::before {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
            border-top-left-radius: 16px;
        }

        .login-container::after {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
            border-bottom-right-radius: 16px;
        }

        .logo-box {
            width: 66px;
            height: 66px;
            margin: 0 auto 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.2) 0%, rgba(13, 22, 41, 0.8) 100%);
            border: 1px solid rgba(0, 242, 254, 0.4);
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        .logo-box i {

            color: #00f2fe;

            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 6px;

        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .error-message {
            display: none;

            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.4);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: center;

        .form-group {

        }

        label {
            display: block;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-group i.icon-left {
            position: absolute;
            left: 14px;
            color: #64748b;
            font-size: 15px;
            pointer-events: none;
            transition: color 0.3s;
        }

        input {
            width: 100%;
            height: 46px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.7);
            padding: 0 42px;
            font-size: 16px;
            color: #ffffff;
            outline: none;
            transition: all 0.25s ease-in-out;
            -webkit-appearance: none;

            background: transparent;
            color: #64748b;

            font-size: 15px;

            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);

    <script>
        /* --- ANIMASI JARINGAN PARTIKEL DATA (CANVAS) --- */
        const canvas = document.getElementById('tech-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            particles = [];
            const particleCount = Math.min(Math.floor(window.innerWidth / 15), 70);
            
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.7,
                    vy: (Math.random() - 0.5) * 0.7,
                    radius: Math.random() * 1.8 + 1
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                let p1 = particles[i];

                p1.x += p1.vx;
                p1.y += p1.vy;

                if (p1.x < 0 || p1.x > canvas.width) p1.vx *= -1;
                if (p1.y < 0 || p1.y > canvas.height) p1.vy *= -1;

                ctx.beginPath();
                ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00f2fe';
                ctx.fill();

                for (let j = i + 1; j < particles.length; j++) {
                    let p2 = particles[j];
                    let dx = p1.x - p2.x;
                    let dy = p1.y - p2.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(0, 242, 254, ${1 - dist / 120})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawParticles);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        drawParticles();

        const togglePasswordBtn = document.getElementById("togglePassword");
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");
        const loginForm = document.getElementById("loginForm");
        const errorMessage = document.getElementById("errorMessage");

        // Toggle Password Visibility
        togglePasswordBtn.addEventListener("click", () => {
            const isPassword = passwordInput.type === "password";
            passwordInput.type = isPassword ? "text" : "password";
            
            eyeIcon.classList.toggle("fa-eye-slash", !isPassword);
            eyeIcon.classList.toggle("fa-eye", isPassword);
            
            togglePasswordBtn.setAttribute(
                "aria-label", 
                isPassword ? "Sembunyikan password" : "Tampilkan password"
            );
        });

        // Event Login & Redirect berdasarkan Kelas
        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            errorMessage.style.display = "none";

            const usernameInput = document.getElementById("username").value.trim();
            const passwordInputValue = passwordInput.value.trim();

            const foundUser = usersData.find(
                (u) => u.user === usernameInput && u.pass === passwordInputValue
            );

            if (foundUser) {
                // Simpan nama agar tetap bisa dimunculkan di halaman selanjutnya
                sessionStorage.setItem("userNama", foundUser.nama);
                
                // --- LOGIKA REDIRECT BERDASARKAN KELAS ---
                if (foundUser.kelas === "7") {
                    window.location.href = "https://cbtsmpmuh2depok.blogspot.com/2025/09/jadwal-kelas-7.html";
                } else if (foundUser.kelas === "8") {

                    window.location.href = "https://cbtsmpmuh2depok.blogspot.com/2025/09/kelas.html";
                }

            } else {
                errorMessage.textContent = "USERNAME ATAU PASSWORD SALAH!";
                errorMessage.style.display = "block";
            }
        });
